services:
  ai-attendance:
    build: .
    container_name: hosteleaze-ai-attendance
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8000
      - MATCH_THRESHOLD=85.0
      - SPOOF_CONFIDENCE_THRESHOLD=0.80
    volumes:
      - ./models:/app/models
